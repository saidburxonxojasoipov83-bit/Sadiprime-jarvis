# SadiPrime Jarvis — config.yaml
# Secrets: faqat ${ENV}

# ---------------------------------------------------------------------------
# PHASE 1 MEMORY
#   Working → Redis (REDIS_URL)
#   Conversation/Long → PostgreSQL (DATABASE_URL)
#   Knowledge → Obsidian vault
#   Semantic → Phase 4 Qdrant
# ---------------------------------------------------------------------------

mcp_servers:
  obsidian:
    command: "npx"
    args: ["-y", "obsidian-mcp", "${HERMES_HOME}/vault"]
    tools:
      exclude: []
    enabled: true

  filesystem:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${HERMES_HOME}/workspace"]
    enabled: true

  browser:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--headless"]
    enabled: true

  postgres:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-postgres", "${DATABASE_URL}"]
    enabled: true

  github:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
    enabled: false

  render:
    command: "npx"
    args: ["mcp-remote", "https://mcp.render.com/mcp", "--header", "Authorization: Bearer ${RENDER_API_KEY}"]
    enabled: false

  supabase:
    command: "npx"
    args: ["-y", "@supabase/mcp-server-supabase@latest", "--access-token", "${SUPABASE_ACCESS_TOKEN}"]
    enabled: false

# ---------------------------------------------------------------------------
# STT / TTS
# ---------------------------------------------------------------------------
stt:
  provider: "local"
  local:
    model: "base"

tts:
  provider: "piper"
  piper:
    voice: "en_US-lessac-medium"
  speed: 1.0

# ---------------------------------------------------------------------------
# PHASE 3 — MODEL ROUTER & LLM MANAGEMENT
# Diagramma: ModelRouter | LoadBalancer | Fallback | CostOptimizer | Aggregator
#
# Asosiy: OpenRouter (ko'p model bitta kalit)
# Zaxira zanjiri: Gemini → Mistral → Cerebras
# ---------------------------------------------------------------------------
model:
  provider: "openrouter"
  default: "anthropic/claude-sonnet-4.6"
  api_mode: "chat_completions"

providers:
  openrouter:
    type: "openai"
    base_url: "https://openrouter.ai/api/v1"
    key_env: "OPENROUTER_API_KEY"
  gemini:
    type: "openai"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    key_env: "GEMINI_API_KEY"
  mistral:
    type: "openai"
    base_url: "https://api.mistral.ai/v1"
    key_env: "MISTRAL_API_KEY"
  cerebras:
    type: "openai"
    base_url: "https://api.cerebras.ai/v1"
    key_env: "CEREBRAS_API_KEY"
  anthropic:
    type: "anthropic"
    key_env: "ANTHROPIC_API_KEY"

fallback_providers:
  - provider: "openrouter"
    model: "anthropic/claude-sonnet-4.6"
  - provider: "openrouter"
    model: "google/gemini-2.0-flash-001"
  - provider: "gemini"
    model: "gemini-2.0-flash"
  - provider: "mistral"
    model: "mistral-large-latest"
  - provider: "cerebras"
    model: "llama-3.3-70b"

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
terminal:
  backend: "local"
  persistent_shell: true

# ---------------------------------------------------------------------------
# Telegram
# ---------------------------------------------------------------------------
gateway:
  platforms:
    telegram:
      home_chat_id: "${TELEGRAM_ALLOWED_USERS}"
      gateway_restart_notification: true
      typing_indicator: true

display:
  tool_progress: "new"
