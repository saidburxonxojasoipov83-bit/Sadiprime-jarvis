# SadiPrime Jarvis — config.yaml (Railway: ${HERMES_HOME}/config.yaml)
# Secrets faqat env orqali: ${VAR}

# ---------------------------------------------------------------------------
# PHASE 1 MEMORY MAP (arxitektura)
#   Working Memory     → Redis        (REDIS_URL)
#   Conversation/Long  → PostgreSQL   (DATABASE_URL)
#   Knowledge/Notes    → Obsidian vault (${HERMES_HOME}/vault)
#   Semantic/Vector    → Phase 4 (Qdrant)
# ---------------------------------------------------------------------------

mcp_servers:
  # Knowledge Memory — Markdown vault (doimiy disk)
  obsidian:
    command: "npx"
    args: ["-y", "obsidian-mcp", "${HERMES_HOME}/vault"]
    tools:
      exclude: []
    enabled: true

  # Filesystem — workspace (kod, loyihalar)
  filesystem:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${HERMES_HOME}/workspace"]
    enabled: true

  # Browser — Playwright
  browser:
    command: "npx"
    args: ["-y", "@playwright/mcp@latest", "--headless"]
    enabled: true

  # PostgreSQL — Conversation + Long-term memory (DATABASE_URL bo'lsa)
  postgres:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-postgres", "${DATABASE_URL}"]
    enabled: true

  # GitHub — token bo'lsa yoqing
  github:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
    enabled: false

  render:
    command: "npx"
    args: ["mcp-remote", "https://mcp.render.com/mcp", "--header", "Authorization: Bearer ${RENDER_API_KEY}"]
    enabled: false

  supabase:
    command: "npx"
    args: ["-y", "@supabase/mcp-server-supabase@latest", "--access-token", "${SUPABASE_ACCESS_TOKEN}"]
    enabled: false

# ---------------------------------------------------------------------------
# STT / TTS
# ---------------------------------------------------------------------------
stt:
  provider: "local"
  local:
    model: "base"

tts:
  provider: "piper"
  piper:
    voice: "en_US-lessac-medium"
  speed: 1.0

# ---------------------------------------------------------------------------
# LLM — Model Router (Phase 3 da kengaytiriladi)
# ---------------------------------------------------------------------------
model:
  provider: "openrouter"
  default: "anthropic/claude-sonnet-4.6"
  api_mode: "chat_completions"

providers:
  cerebras:
    type: "openai"
    base_url: "https://api.cerebras.ai/v1"
    key_env: "CEREBRAS_API_KEY"
  mistral:
    type: "openai"
    base_url: "https://api.mistral.ai/v1"
    key_env: "MISTRAL_API_KEY"

fallback_providers:
  - provider: "gemini"
    model: "gemini-2.0-flash"
  - provider: "mistral"
    model: "mistral-large-latest"
  - provider: "cerebras"
    model: "llama-3.3-70b"

# ---------------------------------------------------------------------------
# Terminal (vibe coding) — konteyner ichida
# ---------------------------------------------------------------------------
terminal:
  backend: "local"
  persistent_shell: true

# ---------------------------------------------------------------------------
# Telegram Gateway
# ---------------------------------------------------------------------------
gateway:
  platforms:
    telegram:
      home_chat_id: "${TELEGRAM_ALLOWED_USERS}"
      gateway_restart_notification: true
      typing_indicator: true

display:
  tool_progress: "new"
